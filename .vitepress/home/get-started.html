<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get started with Stress AI Coach: a one-minute check-in</title>
<meta name="description" content="Answer a few quick questions and get a starter plan for Stress AI Coach: which features to try first on your iPhone and Apple Watch.">
<meta property="og:type" content="website">
<meta property="og:title" content="Get started with Stress AI Coach">
<meta property="og:description" content="A one-minute check-in that builds your starter plan for the app.">
<meta property="og:image" content="https://phuongddx.github.io/stress-coach-ai/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F1F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1411" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  One file serves /get-started/ and /vi/get-started/ (scripts/home.mjs copies it to both).
  The language comes from the URL. Nothing typed or picked here leaves the page:
  no form posts, no analytics, no storage.
-->
<style>
:root{
  --bg:#F1F1E8;--surface:#FCFCF8;--sand:#E6EADC;--sand-2:#D9DFCD;
  --fg:#13211D;--muted:#44524C;--border:#D2D8C9;--border-2:#B9C2B1;
  --accent:#206A5D;--sky:#BFDCAE;--sky-soft:#DCEBD2;--lime:#81B214;
  --ink:#13211D;--ink-2:#1E3530;--on-ink:#F1F1E8;--shadow:19 33 29;
  --font-display:"Bricolage Grotesque","Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:28px;--r-md:18px;--ease:cubic-bezier(.22,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1411;--surface:#14201B;--sand:#1C2A24;--sand-2:#26362F;
    --fg:#EEF1E6;--muted:#B9C5B8;--border:#2A3A33;--border-2:#3A4C44;
    --accent:#5FBFA9;--sky:#2C6B5C;--sky-soft:#1F3830;--lime:#9CCB3A;
    --ink:#1C2A24;--ink-2:#26362F;--on-ink:#EEF1E6;--shadow:0 0 0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
[tabindex="-1"]:focus{outline:none}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-0.025em}
h1{font-size:clamp(2.1rem,1.4rem + 2.4vw,3.2rem);line-height:1.02;font-weight:700}
h2{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.2rem);line-height:1.1}
h3{font-size:1.12rem;line-height:1.25;letter-spacing:-0.01em}
p{margin:0;text-wrap:pretty}
.muted{color:var(--muted)}
.hl{color:var(--accent)}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar-in{max-width:640px;margin:0 auto;padding:14px 20px;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;gap:14px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,opacity .2s}
.icon-btn:hover{border-color:var(--border-2)}
.icon-btn[hidden]{display:grid;visibility:hidden}
.icon-btn svg{width:20px;height:20px}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;font-weight:600;font-size:15px}
.brand img{width:28px;height:28px;border-radius:8px}
.progress{grid-column:1/-1;height:6px;border-radius:99px;background:var(--sand);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .45s var(--ease)}
.lang{white-space:nowrap;font-size:13px;font-weight:600;text-decoration:none;justify-self:end;padding:8px 10px;border-radius:10px}
.lang:hover{background:var(--sand)}

main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:12px 20px 40px}
.step{animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step,.progress i,.ripple-bob{animation:none!important;transition:none!important}}

/* intro */
.intro{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:8px}
.ripple-hero{width:min(170px,44vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 58%,var(--sky-soft),transparent 70%)}
.ripple-bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.intro .lede{max-width:30em;color:var(--muted);font-size:1.05rem}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.facts li{font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--border)}
.legal-note{font-size:12.5px;color:var(--muted);max-width:32em}

/* question */
.q-count{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.q-lead{font-size:15px;color:var(--muted);margin-bottom:6px}
.q-help{color:var(--muted);margin-top:10px}
.opts{display:grid;gap:12px;margin-top:26px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:14px 18px;text-align:left;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .2s,background .2s,transform .15s var(--ease)}
.opt:hover{border-color:var(--border-2)}
.opt:active{transform:scale(.99)}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sand);display:grid;place-items:center;color:var(--accent)}
.opt .ic svg{width:22px;height:22px}
.opt .t{display:grid;gap:2px}
.opt .t b{font-weight:600}
.opt .t small{color:var(--muted);font-size:14px}
.opt .tick{margin-left:auto;flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid var(--border-2);display:grid;place-items:center}
.opt[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt .tick svg{width:14px;height:14px;opacity:0}
.opt[aria-checked="true"] .tick svg{opacity:1}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:26px}
.scale .opt{flex-direction:column;justify-content:center;text-align:center;gap:8px;min-height:104px;padding:14px 8px}
.dots{display:flex;gap:4px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--border-2)}
.dots span.on{background:var(--accent)}
@media (max-width:460px){.scale{grid-template-columns:1fr 1fr}}

/* buttons */
.actions{margin-top:28px;display:grid;gap:12px;justify-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border:0;border-radius:16px;background:var(--accent);color:var(--bg);font-weight:600;font-size:17px;cursor:pointer;text-decoration:none;min-width:min(320px,100%);transition:transform .2s var(--ease),opacity .2s,filter .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn-text{background:none;border:0;padding:10px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer}

/* interstitial */
.mid{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:20px}
.mid img{width:min(200px,50vw)}
.checklist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px;text-align:left;width:min(360px,100%)}
.checklist li{display:flex;align-items:center;gap:12px;color:var(--muted);transition:color .3s}
.checklist li::before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--border-2);transition:background .3s,border-color .3s}
.checklist li.done{color:var(--fg)}
.checklist li.done::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--bg)}

/* result */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:clamp(20px,4vw,28px)}
.result-top{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.result-top img{width:96px;height:96px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--sky-soft);color:var(--accent);margin-bottom:8px}
.bars{display:grid;gap:14px;margin-top:22px}
.bar-row{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}
.bar-row b{font-weight:600;font-size:15px}
.meter{height:10px;border-radius:99px;background:var(--sand);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--accent);width:0;transition:width .8s var(--ease)}
.bar-row small{grid-column:2;color:var(--muted);font-size:13.5px;margin-top:-6px}
.disclaimer{font-size:13.5px;color:var(--muted);margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.stack{display:grid;gap:16px;margin-top:16px}
.plan{display:grid;gap:12px}
.plan-item{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:16px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--border)}
.plan-item .n{width:44px;height:44px;border-radius:14px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px}
.plan-item p{color:var(--muted);font-size:15px;margin-top:4px}
.shot{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.shot img{border-radius:18px;filter:drop-shadow(0 16px 22px rgb(var(--shadow) / .18))}
.price{font-size:15px;color:var(--muted)}
.price b{color:var(--fg)}
.appstore{display:inline-flex;align-items:center;gap:12px;min-height:60px;padding:0 26px 0 20px;border-radius:16px;background:var(--ink);color:var(--on-ink);text-decoration:none;box-shadow:0 10px 24px -12px rgb(var(--shadow) / .55);transition:background .2s,transform .2s var(--ease)}
.appstore:hover{background:var(--ink-2);transform:translateY(-2px)}
@media (prefers-color-scheme:dark){.appstore{box-shadow:0 0 0 1px var(--border-2)}}
.appstore svg{width:26px;height:26px;flex:none}
.appstore span{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.appstore small{font-size:11.5px;letter-spacing:.02em;opacity:.85}
.appstore b{font-size:20px;font-weight:600}
.cta-card{text-align:center;display:grid;gap:14px;justify-items:center}
.sticky-cta{position:sticky;bottom:0;z-index:5;margin:18px -20px -40px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:14px}
.sticky-cta p{font-size:14px;font-weight:600;line-height:1.3}
.sticky-cta .appstore{min-height:48px;padding:0 16px 0 14px;border-radius:13px}
.sticky-cta .appstore svg{width:20px;height:20px}
.sticky-cta .appstore b{font-size:16px}
.sticky-cta.gone{visibility:hidden}

footer{max-width:640px;margin:0 auto;padding:18px 20px 28px;font-size:12.5px;color:var(--muted);text-align:center}
footer a{text-underline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="icon-btn" id="back" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="sr" data-t="back"></span>
    </button>
    <a class="brand" id="home-link" href="../"><img id="brand-icon" src="../assets/icon.png" width="256" height="256" alt="">Stress AI Coach</a>
    <a class="lang" id="lang-link" href="#"></a>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><i></i></div>

</header>

<main id="app" aria-live="polite"></main>

  const t = T[VI ? 'vi' : 'en']

  // Static links and labels.
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t] })
  const langLink = document.getElementById('lang-link')
  langLink.textContent = t.lang
  langLink.href = VI ? ROOT + 'get-started/' : ROOT + 'vi/get-started/'
  langLink.lang = VI ? 'en' : 'vi'
  document.getElementById('home-link').href = LANG_ROOT
  document.getElementById('brand-icon').src = ROOT + 'assets/icon.png'
  const legal = VI ? ROOT + 'vi/legal/' : ROOT + 'legal/'
  document.getElementById('terms-link').href = legal + 'terms'
  document.getElementById('privacy-link').href = legal + 'privacy'

  const img = (name) => ROOT + 'img/' + name
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

  // Flow: intro, watch, goals, when, 4 check-ins, interstitial, result.
  const STEPS = ['intro', 'watch', 'goals', 'when', 'c:body', 'c:mind', 'c:rest', 'c:move', 'mid', 'result']
  const QUESTION_STEPS = STEPS.filter((s) => !['intro', 'mid', 'result'].includes(s)).length
  const state = { i: 0, watch: null, goals: new Set(), when: null, c: {} }
  const app = document.getElementById('app')
  const back = document.getElementById('back')
  const progress = document.getElementById('progress')
  let midTimer = null

  back.addEventListener('click', () => go(state.i === STEPS.indexOf('result') ? STEPS.indexOf('c:move') : state.i - 1))

  function go(i) {
    clearTimeout(midTimer)
    state.i = Math.max(0, Math.min(STEPS.length - 1, i))
    render()
    window.scrollTo({ top: 0 })
    const h = app.querySelector('h1,h2')
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }) }
  }
  const next = () => go(state.i + 1)

  function setProgress() {
    const step = STEPS[state.i]
    let pct = 0
    if (step === 'mid' || step === 'result') pct = 100
    else if (step !== 'intro') pct = Math.round((state.i / (QUESTION_STEPS + 1)) * 100)
    progress.querySelector('i').style.width = pct + '%'
    progress.setAttribute('aria-valuenow', String(pct))
    back.hidden = step === 'intro' || step === 'mid'
  }

  function option({ key, icon, title, sub, pressed, multi }) {
    return `<button type="button" class="opt" data-key="${key}" ${multi ? `role="checkbox" aria-checked="${pressed}"` : `aria-pressed="${pressed}"`}>
      ${icon ? `<span class="ic" aria-hidden="true">${ICONS[icon]}</span>` : ''}
      <span class="t"><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>
      ${multi ? `<span class="tick" aria-hidden="true">${ICONS.tick}</span>` : ''}
    </button>`
  }

  function single(title, help, items, current, onPick) {
    app.innerHTML = `<section class="step">
      <h2>${esc(title)}</h2>${help ? `<p class="q-help">${esc(help)}</p>` : ''}
      <div class="opts">${items.map((o) => option({ ...o, pressed: current === o.key })).join('')}</div>
    </section>`
    app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
      onPick(b.dataset.key)
      b.setAttribute('aria-pressed', 'true')
      setTimeout(next, 220)
    }))
  }

  function render() {
    setProgress()
    const step = STEPS[state.i]

    if (step === 'intro') {
      app.innerHTML = `<section class="step intro">
        <div class="ripple-hero"><img class="ripple-bob" src="${img('ripple/base-head.svg')}" width="512" height="512" alt="Ripple, the Stress AI Coach otter"></div>
        <div><p class="q-count">${esc(t.introEyebrow)}</p><h1>${t.introTitle}</h1></div>
        <p class="lede">${esc(t.introLede)}</p>
        <ul class="facts">${t.introFacts.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>
        <div class="actions"><button type="button" class="btn" id="start">${esc(t.introStart)}</button></div>
        <p class="legal-note">${esc(t.introNote)}</p>
      </section>`
      app.querySelector('#start').addEventListener('click', next)
      return
    }

    if (step === 'watch') {
      return single(t.watchQ, t.watchHelp, [
        { key: 'daily', icon: 'watch', title: t.watchYes[0], sub: t.watchYes[1] },
        { key: 'some', icon: 'watch', title: t.watchSome[0], sub: t.watchSome[1] },
        { key: 'none', icon: 'phone', title: t.watchNo[0], sub: t.watchNo[1] },
      ], state.watch, (k) => { state.watch = k })
    }

    if (step === 'goals') {
      const icons = { understand: 'chart', calm: 'wind', talk: 'chat', habits: 'leaf' }
      app.innerHTML = `<section class="step">
        <h2>${esc(t.goalQ)}</h2><p class="q-help">${esc(t.pickAny)}</p>
        <div class="opts" role="group">${Object.entries(t.goals).map(([k, [a, b]]) => option({ key: k, icon: icons[k], title: a, sub: b, pressed: state.goals.has(k), multi: true })).join('')}</div>
        <div class="actions"><button type="button" class="btn" id="cont" ${state.goals.size ? '' : 'disabled'}>${esc(t.next)}</button></div>
      </section>`
      const cont = app.querySelector('#cont')
      app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
        const k = b.dataset.key
        state.goals.has(k) ? state.goals.delete(k) : state.goals.add(k)
        b.setAttribute('aria-checked', String(state.goals.has(k)))
        cont.disabled = state.goals.size === 0
      }))
      cont.addEventListener('click', next)
      return
    }

    if (step === 'when') {
      const icons = { morning: 'sun', work: 'brief', evening: 'moon', varies: 'shuffle' }
      return single(t.whenQ, '', Object.entries(t.when).map(([k, [a, b]]) => ({ key: k, icon: icons[k], title: a, sub: b })), state.when, (k) => { state.when = k })
    }

    if (step.startsWith('c:')) {
      const key = step.slice(2)
      const n = ['body', 'mind', 'rest', 'move'].indexOf(key) + 1
      app.innerHTML = `<section class="step">
        <p class="q-count">${esc(t.checkCount(n))}</p>
        <p class="q-lead">${esc(t.checkLead)}</p>
        <h2>${esc(t.checks[key])}</h2>
        <div class="scale">${t.scale.map((label, v) => `<button type="button" class="opt" data-v="${v}" aria-pressed="${state.c[key] === v}">
          <span class="dots" aria-hidden="true">${[0, 1, 2, 3].map((d) => `<span class="${d <= v ? 'on' : ''}"></span>`).join('')}</span>
          <b>${esc(label)}</b></button>`).join('')}</div>
      </section>`
      app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', () => {
        state.c[key] = Number(b.dataset.v)
        app.querySelectorAll('.opt').forEach((o) => o.setAttribute('aria-pressed', String(o === b)))
        setTimeout(next, 220)
      }))
      return
    }

    if (step === 'mid') {
      app.innerHTML = `<section class="step mid">
        <img class="ripple-bob" src="${img('ripple/thinking.svg')}" width="512" height="512" alt="">
        <h2>${esc(t.midTitle)}</h2>
        <ul class="checklist">${t.midSteps.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>
      </section>`
      const items = [...app.querySelectorAll('.checklist li')]
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
      const gap = reduce ? 150 : 650
      items.forEach((li, k) => setTimeout(() => li.classList.add('done'), gap * (k + 1)))
      midTimer = setTimeout(next, gap * (items.length + 1))
      return
    }

    if (step === 'result') renderResult()
  }

  function buildPlan() {
    const g = state.goals, c = state.c
    const hasWatch = state.watch !== 'none'
    const picks = []
    const add = (k) => { if (!picks.includes(k) && picks.length < 3) picks.push(k) }

    // 1. Always start with the score, or with getting a watch if there is none.
    add(hasWatch ? 'score' : 'scoreNoWatch')
    // 2. The strongest area decides the first reset.
    const order = Object.entries(c).sort((a, b) => b[1] - a[1])
    const [topKey, topVal] = order[0] || ['mind', 0]
    if (g.has('talk')) add('ripple')
    if (topVal >= 1) {
      if (topKey === 'mind') add(hasWatch && state.when === 'work' ? 'watchBreathe' : 'box')
      if (topKey === 'body') add('bodyScan')
      if (topKey === 'rest') add(hasWatch ? 'sleep' : 'box')
      if (topKey === 'move') add('walk')
    }
    if (g.has('calm')) add(hasWatch ? 'watchBreathe' : 'box')
    if (g.has('habits')) add('habits')
    if (g.has('understand')) add('trends')
    // 3. Fill with a glanceable surface, matched to the time of day.
    if (hasWatch && (state.when === 'work' || state.when === 'varies')) add('glanceWatch')
    add('glancePhone')
    add('box')
    return picks
  }

  function renderResult() {
    const c = state.c
    const keys = ['body', 'mind', 'rest', 'move']
    const total = keys.reduce((s, k) => s + (c[k] || 0), 0) // 0..12
    const level = total <= 3 ? 0 : total <= 6 ? 1 : total <= 9 ? 2 : 3
    const heads = ['relaxed-head.svg', 'mild-head.svg', 'elevated-head.svg', 'high-head.svg']
    const top = keys.reduce((a, b) => ((c[b] || 0) > (c[a] || 0) ? b : a), keys[0])
    const [lvlName, lvlText] = t.levels[level]
    const plan = buildPlan()

    app.innerHTML = `<section class="step">
      <div class="card">
        <div class="result-top">
          <img src="${img('ripple/' + heads[level])}" width="512" height="512" alt="">
          <div><span class="pill">${esc(t.resTitle)}</span><h2>${esc(lvlName)}</h2></div>
        </div>
        <p class="muted" style="margin-top:14px">${esc(lvlText)}</p>
        ${total > 0 ? `<p style="margin-top:10px">${t.topArea(esc(t.areas[top]))}</p>` : ''}
        <div class="bars">${keys.map((k) => `<div class="bar-row">
          <b>${esc(t.areas[k])}</b>
          <div class="meter" role="img" aria-label="${esc(t.areas[k])}: ${esc(t.scale[c[k] || 0])}"><i data-w="${((c[k] || 0) + 1) * 25}"></i></div>
          <small>${esc(t.areaHint[k])} · ${esc(t.scale[c[k] || 0])}</small>
        </div>`).join('')}</div>
        <p class="disclaimer">${esc(t.disclaimer)}</p>
      </div>

      <div class="card stack">
        <div><h2>${esc(t.planTitle)}</h2><p class="muted" style="margin-top:6px">${esc(t.planLede)}</p></div>
        <div class="plan">${plan.map((k, n) => `<div class="plan-item"><span class="n">${n + 1}</span><div><h3>${esc(t.plan[k][0])}</h3><p>${esc(t.plan[k][1])}</p></div></div>`).join('')}</div>
        <div class="shot" aria-hidden="true">
          <picture><source srcset="${img('v2/phone-home-dark.webp')}" media="(prefers-color-scheme: dark)"><img src="${img('v2/phone-home-light.webp')}" alt="" loading="lazy"></picture>
          <picture><source srcset="${img('v2/phone-breatheIntro-dark.webp')}" media="(prefers-color-scheme: dark)"><img src="${img('v2/phone-breatheIntro-light.webp')}" alt="" loading="lazy"></picture>
        </div>
      </div>

      <div class="card stack cta-card">
        <h2>${esc(t.ctaTitle)}</h2>
        <p class="muted">${esc(t.ctaLede)}</p>
        <a class="appstore" id="appstore-cta" href="${APP_STORE}">${ICONS.apple}<span><small>${esc(t.appSmall)}</small><b>${esc(t.appBig)}</b></span></a>
        <p class="muted" style="font-size:14px">${esc(t.req)}</p>
        <p class="price">${t.price}</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
          <button type="button" class="btn-text" id="retake">${esc(t.retake)}</button>
          <a class="btn-text" href="${VI ? ROOT + 'vi/principle/' : ROOT + 'principle/'}">${esc(t.learn)}</a>
        </div>
      </div>

      <div class="sticky-cta" id="sticky-cta">
        <p>${esc(t.ctaTitle)}</p>
        <a class="appstore" href="${APP_STORE}">${ICONS.apple}<span><small>${esc(t.appSmall)}</small><b>${esc(t.appBig)}</b></span></a>
      </div>
    </section>`
    // Hide the sticky bar once the main App Store button is on screen.
    const sticky = app.querySelector('#sticky-cta')
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(([e]) => sticky.classList.toggle('gone', e.isIntersecting))
        .observe(app.querySelector('#appstore-cta'))
    }
    requestAnimationFrame(() => app.querySelectorAll('.meter i').forEach((i) => { i.style.width = i.dataset.w + '%' }))
    app.querySelector('#retake').addEventListener('click', () => {
      state.watch = null; state.goals = new Set(); state.when = null; state.c = {}
      go(0)
    })
  }

  render()
})()
</script>
</body>
</html>
